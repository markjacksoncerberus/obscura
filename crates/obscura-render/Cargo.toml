[package]
name = "obscura-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless HTML/CSS rendering for Obscura, backed by the Blitz engine (CPU rasterizer)."

[dependencies]
# `default-features = false` drops blitz-dom's `system_fonts` feature, which
# would otherwise pull `parley/system` → fontconfig (a build- and run-time
# system library). We render with the bundled font only, so we want neither.
# `svg`/`woff` are pure-Rust and keep SVG images and WOFF/WOFF2 web fonts
# working. `accessibility`, `custom-widget`, and `file_input` are irrelevant to
# headless rasterization and stay off.
#
# IMPORTANT: these `=` versions MUST match the version in the local Blitz fork
# (`../blitz`, wired via `[patch.crates-io]` in the root Cargo.toml). The patch
# only applies when the fork's version satisfies this requirement; if they
# drift (e.g. the fork bumps to a new alpha), cargo SILENTLY drops the patch
# (`warning: patch ... was not used`) and builds against the upstream registry
# crate instead — losing every fork fix (SVG currentColor, WOFF2 fonts, …).
# When bumping the fork, bump these in lockstep and `anyrender*` below to the
# versions the fork's workspace pins.
blitz-dom = { version = "=0.3.0-alpha.5", default-features = false, features = ["svg", "woff", "incremental"] }
blitz-html = "=0.3.0-alpha.5"
# Stylo's computed-value types, so geometry queries can read `display`,
# `position`, `visibility` and `opacity` off a laid-out node. Blitz already
# pulls this exact version, so naming it here costs no extra compilation — it
# just lets us name the enums instead of round-tripping them through strings.
style = { version = "0.18.0", package = "stylo", default-features = false }
blitz-paint = "=0.3.0-alpha.5"
blitz-traits = "=0.3.0-alpha.5"
anyrender = "0.11"
anyrender_vello_cpu = "0.14"
# 2D geometry/paint primitives. Pinned to the same versions Blitz/anyrender
# resolve to so the `PaintScene` brush/shape types unify across crates.
peniko = "0.6"
kurbo = "0.13"
# Image codecs for `<img>`/`background-image` decode (done in blitz-dom's net
# layer via `image::ImageReader::with_guessed_format`). Cargo unifies these
# features with the gif/webp set `anyrender_svg` pulls in, so the union here is
# what blitz can decode. `ico`+`bmp` add favicon (`<link rel="icon">`) coverage
# and are pure-Rust — no C dependency, keeping the build portable. `ico` decode
# is built on `bmp`+`png`, so `bmp` is listed explicitly. AVIF is NOT here: it
# is gated behind the optional `avif` feature below, whose decoder pulls a C
# library (see that feature's note).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "bmp"] }
tracing = { workspace = true }
thiserror = { workspace = true }
# Sub-resource fetching for layout/paint goes through Obscura's own HTTP client
# so a stylesheet is fetched with the same cookies, proxy and blocking rules as
# the page that linked it (see `http.rs`).
obscura-net = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }

[features]
# AVIF image decoding (e.g. Next.js `<Image>`, which serves `image/avif` by
# default). OFF by default and intentionally so: `avif-native` pulls the
# `dav1d` C library (libdav1d >= 1.3.0), which breaks the otherwise pure-Rust,
# cross-compile-friendly build and raises the system requirements above what
# some target distros ship. Enable it only when you need AVIF coverage AND can
# provide libdav1d — see `scripts/build-dav1d.sh` and the build note in
# `tickets/svg-currentcolor-and-image-formats.md`. Without this feature, AVIF
# falls back to a blank box, but most sites (incl. Next.js) also serve WebP,
# which decodes pure-Rust.
avif = ["image/avif-native"]
