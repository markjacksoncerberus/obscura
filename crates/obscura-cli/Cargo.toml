[package]
name = "obscura-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "obscura"
path = "src/main.rs"

[[bin]]
name = "obscura-worker"
path = "src/worker.rs"

[features]
default = []
stealth = ["obscura-browser/stealth", "obscura-net/stealth", "obscura-mcp/stealth"]
# Build the Blitz-backed renderer into the `obscura` binary. Off by default;
# enable with `cargo build --features render`. Turn it on at runtime with
# `--render-mode on-demand|always`.
render = ["obscura-cdp/render", "obscura-browser/render"]
# Opt-in AVIF image decoding (implies `render`). Build with
# `cargo build --release --features render,avif`. Requires libdav1d >= 1.3.0 on
# the system (see `scripts/build-dav1d.sh`); pulls a C dependency, so it is kept
# out of the default/`render` build to preserve the pure-Rust toolchain.
avif = ["render", "obscura-cdp/avif", "obscura-browser/avif"]

[dependencies]
obscura-browser = { workspace = true }
obscura-mcp = { workspace = true }
obscura-cdp = { workspace = true }
obscura-dom = { workspace = true }
obscura-net = { workspace = true }
obscura-js = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
