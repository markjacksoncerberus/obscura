[package]
name = "obscura-cdp"
version.workspace = true
edition.workspace = true

[features]
default = []
# Propagates the Blitz renderer down to obscura-browser so CDP screenshots
# (Page.captureScreenshot) and real layout metrics work.
render = ["obscura-browser/render"]
# Opt-in AVIF image decoding (implies `render`). See obscura-render's `avif`
# feature note — pulls the dav1d C library.
avif = ["render", "obscura-browser/avif"]

[dependencies]
obscura-dom = { workspace = true }
obscura-browser = { workspace = true }
obscura-js = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
futures-util = "0.3"
obscura-net = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
