[package]
name = "obscura-js"
version.workspace = true
edition.workspace = true

[build-dependencies]
deno_core = "0.350"

[dependencies]
obscura-dom = { workspace = true }
obscura-net = { workspace = true }
deno_core = "0.350"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
html5ever = { workspace = true }
deno_error = "0.6"
base64 = { workspace = true }
encoding_rs = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "arithmetic"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8", "arithmetic"] }
p521 = { version = "0.13", features = ["ecdsa", "pkcs8", "arithmetic"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ecdsa = "0.16"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
ghash = "0.6"
aes-kw = "0.3"
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
# The RSA stack rides the newer digest generation (0.11); the HMAC/PBKDF2 stack
# above rides 0.10. Both are here on purpose, aliased so the two Sha256 types
# can never be confused for one another at a call site.
sha1_v11 = { package = "sha1", version = "0.11", features = ["oid"] }
sha2_v11 = { package = "sha2", version = "0.11", features = ["oid"] }

